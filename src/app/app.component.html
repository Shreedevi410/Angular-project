<main class="task-app">
  <header class="task-app__header">
    <p class="task-app__eyebrow">MY DAY</p>
    <h1>Task list</h1>
    <p class="task-app__subtitle">A little progress adds up.</p>
  </header>

  <form class="task-form" (submit)="$event.preventDefault(); addTask(taskInput.value); taskInput.value = ''">
    <label class="visually-hidden" for="new-task">Add a task</label>
    <input
      #taskInput
      id="new-task"
      type="text"
      placeholder="What needs to get done?"
      autocomplete="off"
    />
    <button type="submit">Add task</button>
  </form>

  <nav class="task-filters" aria-label="Filter tasks">
    <button
      type="button"
      [class.task-filters__button--selected]="taskFilter === 'all'"
      [attr.aria-pressed]="taskFilter === 'all'"
      (click)="taskFilter = 'all'"
    >
      All
    </button>
    <button
      type="button"
      [class.task-filters__button--selected]="taskFilter === 'active'"
      [attr.aria-pressed]="taskFilter === 'active'"
      (click)="taskFilter = 'active'"
    >
      Active
    </button>
    <button
      type="button"
      [class.task-filters__button--selected]="taskFilter === 'completed'"
      [attr.aria-pressed]="taskFilter === 'completed'"
      (click)="taskFilter = 'completed'"
    >
      Completed
    </button>
  </nav>

  <div class="task-toolbar" *ngIf="tasks.length > 0">
    <button class="task-toolbar__toggle" type="button" (click)="toggleAllTasks()">
      {{ allTasksCompleted ? 'Mark all incomplete' : 'Mark all complete' }}
    </button>
  </div>

  <section class="task-list" aria-label="Tasks">
    <p class="task-list__empty" *ngIf="tasks.length === 0">
      No tasks yet. Add one above to get started.
    </p>

    <p class="task-list__empty" *ngIf="tasks.length > 0 && visibleTaskCount === 0">
      No {{ taskFilter }} tasks.
    </p>

    <ng-container *ngFor="let task of tasks; let i = index">
      <article class="task" *ngIf="isTaskVisible(task)">
        <label class="task__content">
          <input
            type="checkbox"
            [checked]="task.completed"
            (change)="toggleTask(i)"
          />
          <span *ngIf="editingTaskIndex !== i" [class.task__text--completed]="task.completed">
            {{ task.title }}
          </span>
          <input
            *ngIf="editingTaskIndex === i"
            class="task__edit-input"
            type="text"
            [(ngModel)]="draftTaskTitle"
            (keyup.enter)="saveEditedTask(i)"
            (keyup.escape)="cancelEditingTask()"
            aria-label="Edit task title"
          />
        </label>

        <div class="task__actions">
          <button
            *ngIf="editingTaskIndex !== i"
            class="task__edit"
            type="button"
            (click)="startEditingTask(i)"
          >
            Edit
          </button>
          <button
            *ngIf="editingTaskIndex === i"
            class="task__save"
            type="button"
            (click)="saveEditedTask(i)"
          >
            Save
          </button>
          <button
            *ngIf="editingTaskIndex === i"
            class="task__cancel"
            type="button"
            (click)="cancelEditingTask()"
          >
            Cancel
          </button>
          <button
            class="task__remove"
            type="button"
            [attr.aria-label]="'Remove ' + task.title"
            (click)="removeTask(i)"
          >
            Remove
          </button>
        </div>
      </article>
    </ng-container>
  </section>

  <div class="task-summary" *ngIf="tasks.length > 0">
    <span>Showing {{ visibleTaskCount }} of {{ tasks.length }} tasks</span>
    <span *ngIf="taskFilter !== 'all'">• {{ taskFilter | titlecase }}</span>
  </div>

  <footer class="task-app__footer" *ngIf="tasks.length > 0">
    {{ tasks.length }} {{ tasks.length === 1 ? 'task' : 'tasks' }}
    <button
      class="task-app__clear-completed"
      type="button"
      (click)="clearCompletedTasks()"
    >
      Clear completed
    </button>
  </footer>
</main>
